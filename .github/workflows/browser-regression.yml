name: Browser Regression

on:
  workflow_run:
    workflows:
      - Cloudflare Candidate
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  matrix:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out tested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Download exact tested candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: portfolio-candidate-*
          merge-multiple: true
          path: .

      - name: Verify candidate bytes and evidence
        id: candidate
        run: |
          bun scripts/release-manifest.mjs verify
          bun scripts/release-manifest.mjs verify-candidate
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run full cross-browser acceptance matrix
        run: bun run test:cross-browser
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.candidate.outputs.preview_url }}

      - name: Retain regression results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-browser-regression-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-cross-browser-report
            test-results/cross-browser-results.json
            test-results/cross-browser-artifacts
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
