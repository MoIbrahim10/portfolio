name: Promote Production

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Cloudflare Candidate run ID
        required: true
        type: string
      candidate_sha:
        description: Full 40-character SHA currently at main
        required: true
        type: string
      confirmation:
        description: Type PROMOTE followed by the candidate SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
      url: https://m0code.com
    steps:
      - name: Check out approved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Verify manual promotion approval
        run: bun scripts/release-guard.mjs promotion
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}

      - name: Download exact tested candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: portfolio-candidate-*
          merge-multiple: true
          path: .

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify retained candidate bytes
        run: bun scripts/release-manifest.mjs verify

      - name: Verify retained candidate evidence
        id: candidate
        run: bun scripts/release-manifest.mjs verify-candidate

      - name: Promote exact Cloudflare version
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 263ad8907dc3ed688838c72e2e9f994f
          packageManager: bun
          wranglerVersion: 4.114.0
          command: versions deploy ${{ steps.candidate.outputs.version_id }}@100% --yes

      - name: Verify production HTTP and assets
        run: bun scripts/verify-production-release.mjs

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run production browser tests
        id: production_browser
        run: bun run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://m0code.com

      - name: Run production cross-browser acceptance matrix
        id: production_cross_browser
        run: bun run test:cross-browser
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://m0code.com

      - name: Retain production browser failure evidence
        if: failure() && (steps.production_browser.outcome == 'failure' || steps.production_cross_browser.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-production-browser-failures-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            playwright-cross-browser-report
            test-results
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 30

      - name: Finalize release manifest
        run: bun scripts/release-manifest.mjs finalize
        env:
          CLOUDFLARE_VERSION_ID: ${{ steps.candidate.outputs.version_id }}

      - name: Retain production release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/build-manifest.json
            release/candidate-manifest.json
            release/production-verification.json
            release/release-manifest.json
            test-results/cross-browser-results.json
            test-results/results.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
