name: Cloudflare Candidate

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  BUILD_ARTIFACT_NAME: portfolio-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: cloudflare-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Validate Worker bundle
        run: bunx wrangler@4.114.0 deploy --dry-run

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run browser product tests
        id: browser_tests
        run: bun run test:e2e

      - name: Run cross-browser acceptance matrix
        id: cross_browser_tests
        run: bun run test:cross-browser

      - name: Retain browser failure evidence
        if: failure() && (steps.browser_tests.outcome == 'failure' || steps.cross_browser_tests.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-browser-failures-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            playwright-cross-browser-report
            test-results
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 14

      - name: Create build manifest
        run: bun scripts/release-manifest.mjs create

      - name: Retain immutable build artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: |
            dist
            release/build-manifest.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30

  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ steps.candidate.outputs.preview_url }}
    steps:
      - name: Check out candidate configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download retained build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: .

      - name: Verify retained build artifact
        run: bun scripts/release-manifest.mjs verify

      - name: Apply reviewed preview URL setting
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 263ad8907dc3ed688838c72e2e9f994f
          packageManager: bun
          wranglerVersion: 4.114.0
          command: triggers deploy

      - name: Upload immutable candidate version
        id: upload_version
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 263ad8907dc3ed688838c72e2e9f994f
          packageManager: bun
          wranglerVersion: 4.114.0
          command: versions upload --preview-alias candidate-${{ github.run_id }}

      - name: Record candidate metadata
        id: candidate
        run: bun scripts/release-manifest.mjs stage
        env:
          WRANGLER_COMMAND_OUTPUT: ${{ steps.upload_version.outputs.command-output }}

      - name: Verify candidate version configuration
        run: bunx wrangler@4.114.0 versions view "${{ steps.candidate.outputs.version_id }}" --json > release/cloudflare-version.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 263ad8907dc3ed688838c72e2e9f994f

      - name: Verify candidate HTTP and assets
        run: bun scripts/verify-production-release.mjs
        env:
          DEPLOYMENT_ORIGIN: ${{ steps.candidate.outputs.preview_url }}
          VERIFICATION_OUTPUT_PATH: release/preview-verification.json

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run candidate browser tests
        id: candidate_browser
        run: bun run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.candidate.outputs.preview_url }}

      - name: Run candidate cross-browser acceptance matrix
        id: candidate_cross_browser
        run: bun run test:cross-browser
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.candidate.outputs.preview_url }}

      - name: Retain candidate browser failure evidence
        if: failure() && (steps.candidate_browser.outcome == 'failure' || steps.candidate_cross_browser.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-preview-browser-failures-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            playwright-cross-browser-report
            test-results
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 14

      - name: Finalize candidate manifest
        run: bun scripts/release-manifest.mjs candidate
        env:
          BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          BUILD_ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}

      - name: Retain promotable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist
            release/build-manifest.json
            release/candidate-metadata.json
            release/candidate-manifest.json
            release/cloudflare-version.json
            release/preview-verification.json
            test-results/cross-browser-results.json
            test-results/results.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          retention-days: 30
